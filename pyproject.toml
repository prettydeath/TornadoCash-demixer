[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tornado-demix"
version = "2.17.0"
description = "Tornado Cash forensics: evidence-banded exit leads, exit groups, operator clusters and multi-hop fund tracing after withdrawal on 8 EVM chains, with a placebo check on real data."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tornado-demix contributors" }]
keywords = ["ethereum", "tornado-cash", "blockchain", "forensics", "demixing", "etherscan", "osint", "aml", "deanonymization", "evm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Information Technology",
    "Topic :: Security :: Cryptography",
    "Topic :: Security",
]
dependencies = [
    # Upper bound on purpose: a forensic result must be reproducible from
    # the version that produced it.
    "requests>=2.32.4,<3",
]

[project.optional-dependencies]
web = ["flask>=3.0,<4"]
dev = ["pytest>=8.0,<10", "ruff>=0.6,<0.17", "hypothesis>=6.100,<7", "pycryptodome>=3.20,<4"]
# tools/ens_labels.py: ENS namehash and ABI coding for the labelled evaluation set
labels = ["pycryptodome>=3.20,<4", "eth-abi>=5,<6"]

[project.scripts]
tornado-demix = "tornado_demix.cli:main"

[project.urls]
Homepage = "https://prettydeath.github.io/TornadoCash-demixer/"
Repository = "https://github.com/prettydeath/TornadoCash-demixer"
Documentation = "https://prettydeath.github.io/TornadoCash-demixer/"
Issues = "https://github.com/prettydeath/TornadoCash-demixer/issues"

[tool.setuptools]
packages = ["tornado_demix", "tornado_demix.data"]

# The on-chain-verified pool registry ships inside the package.
[tool.setuptools.package-data]
tornado_demix = ["data/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"webui/app.py" = ["E402"]
"tools/verify_pools.py" = ["E402"]
"tools/calibrate.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the network; excluded by default (run with -m live)"]
addopts = "-m 'not live'"
