name: Docs site

# Builds the documentation site (README as the home page, METHODOLOGY, EVALUATION,
# llms.txt at the root) with MkDocs and publishes it on GitHub Pages.

on:
  push:
    branches: [main]
    paths: ["README.md", "docs/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "mkdocs<2" "mkdocs-material<10"
      - name: Use the README as the home page
        run: |
          cp README.md docs/index.md
          sed -i -E 's#https://github.com/prettydeath/TornadoCash-demixer/blob/main/docs/(METHODOLOGY|EVALUATION)\.md#\1.md#g' docs/index.md
      - run: python -m mkdocs build --strict -d site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
